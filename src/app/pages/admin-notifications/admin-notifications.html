<section class="mx-auto max-w-4xl px-4 py-12 sm:px-6 lg:px-8">
  <div class="mb-8">
    <h1 class="text-3xl font-extrabold text-[var(--qb-text)]">Admin Notifications</h1>
    <p class="mt-2 text-[var(--qb-muted)]">
      Send platform-wide promotional or informational alerts.
    </p>
  </div>

  <div class="rounded-3xl bg-white p-6 shadow-sm ring-1 ring-black/5">
    <form class="space-y-5" (ngSubmit)="sendBulk()">
      <div>
        <label class="mb-2 block text-sm font-semibold text-[var(--qb-text)]">Title</label>
        <input
          [(ngModel)]="form.title"
          name="title"
          type="text"
          class="w-full rounded-2xl border border-black/10 px-4 py-3 outline-none focus:border-[var(--qb-primary)]"
        />
      </div>

      <div>
        <label class="mb-2 block text-sm font-semibold text-[var(--qb-text)]">Message</label>
        <textarea
          [(ngModel)]="form.message"
          name="message"
          rows="4"
          class="w-full rounded-2xl border border-black/10 px-4 py-3 outline-none focus:border-[var(--qb-primary)]"
        ></textarea>
      </div>

      <div class="grid gap-5 md:grid-cols-2">
        <div>
          <label class="mb-2 block text-sm font-semibold text-[var(--qb-text)]">Type</label>
          <select
            [(ngModel)]="form.type"
            name="type"
            class="w-full rounded-2xl border border-black/10 bg-white px-4 py-3 outline-none focus:border-[var(--qb-primary)]"
          >
            <option value="PROMO">Promo</option>
            <option value="ORDER">Order</option>
            <option value="PAYMENT">Payment</option>
            <option value="DELIVERY">Delivery</option>
            <option value="RESTAURANT">Restaurant</option>
            <option value="ADMIN">Admin</option>
          </select>
        </div>

        <div>
          <label class="mb-2 block text-sm font-semibold text-[var(--qb-text)]">Channel</label>
          <select
            [(ngModel)]="form.channel"
            name="channel"
            class="w-full rounded-2xl border border-black/10 bg-white px-4 py-3 outline-none focus:border-[var(--qb-primary)]"
          >
            <option value="APP">In-App</option>
            <option value="EMAIL">Email</option>
            <option value="SMS">SMS</option>
          </select>
        </div>
      </div>

      <div>
        <label class="mb-2 block text-sm font-semibold text-[var(--qb-text)]">
          Recipient IDs (comma separated)
        </label>
        <input
          [(ngModel)]="recipientIdsText"
          name="recipientIdsText"
          type="text"
          placeholder="1,2,3"
          class="w-full rounded-2xl border border-black/10 px-4 py-3 outline-none focus:border-[var(--qb-primary)]"
        />
      </div>

      @if (errorMessage) {
        <p class="rounded-2xl bg-red-50 px-4 py-3 text-sm font-medium text-red-600">
          {{ errorMessage }}
        </p>
      }

      @if (successMessage) {
        <p class="rounded-2xl bg-green-50 px-4 py-3 text-sm font-medium text-green-700">
          {{ successMessage }}
        </p>
      }

      <button
        type="submit"
        [disabled]="submitting"
        class="w-full rounded-2xl bg-[var(--qb-primary)] px-4 py-3 font-semibold text-white transition hover:opacity-90 disabled:opacity-50"
      >
        {{ submitting ? 'Sending...' : 'Send Notification' }}
      </button>
    </form>
  </div>
</section>
