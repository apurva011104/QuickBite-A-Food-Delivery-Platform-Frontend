<section class="mx-auto flex min-h-[75vh] max-w-7xl items-center px-4 py-12 sm:px-6 lg:px-8">
  <div class="mx-auto w-full max-w-md rounded-3xl bg-white p-8 shadow-lg ring-1 ring-black/5">
    <div class="mb-6 text-center">
      <h1 class="text-3xl font-extrabold text-[var(--qb-text)]">Welcome back</h1>
      <p class="mt-2 text-sm text-[var(--qb-muted)]">
        Sign in using your email or phone number.
      </p>
    </div>

    <form class="space-y-5" (ngSubmit)="onLogin()">
      <div>
        <label class="mb-2 block text-sm font-semibold text-[var(--qb-text)]">
          Email or Phone
        </label>
        <input
          type="text"
          name="identifier"
          [(ngModel)]="identifier"
          placeholder="Enter email or phone"
          class="w-full rounded-2xl border border-black/10 px-4 py-3 outline-none transition focus:border-[var(--qb-primary)]"
        />
      </div>

      <div>
        <label class="mb-2 block text-sm font-semibold text-[var(--qb-text)]">Password</label>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          class="w-full rounded-2xl border border-black/10 px-4 py-3 outline-none transition focus:border-[var(--qb-primary)]"
        />
      </div>

      @if (errorMessage) {
        <p class="rounded-2xl bg-red-50 px-4 py-3 text-sm font-medium text-red-600">
          {{ errorMessage }}
        </p>
      }

      <button
        type="submit"
        class="w-full rounded-2xl bg-[var(--qb-primary)] px-4 py-3 font-semibold text-white transition hover:opacity-90"
      >
        Login
      </button>
    </form>

    <div class="my-6 flex items-center gap-3">
      <div class="h-px flex-1 bg-black/10"></div>
      <span class="text-sm text-[var(--qb-muted)]">demo users</span>
      <div class="h-px flex-1 bg-black/10"></div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <button
        type="button"
        (click)="fillDemoCredentials('CUSTOMER')"
        class="rounded-2xl border border-black/10 px-4 py-3 text-sm font-medium transition hover:bg-black/5"
      >
        Customer
      </button>

      <button
        type="button"
        (click)="fillDemoCredentials('OWNER')"
        class="rounded-2xl border border-black/10 px-4 py-3 text-sm font-medium transition hover:bg-black/5"
      >
        Owner
      </button>

      <button
        type="button"
        (click)="fillDemoCredentials('AGENT')"
        class="rounded-2xl border border-black/10 px-4 py-3 text-sm font-medium transition hover:bg-black/5"
      >
        Agent
      </button>

      <button
        type="button"
        (click)="fillDemoCredentials('ADMIN')"
        class="rounded-2xl border border-black/10 px-4 py-3 text-sm font-medium transition hover:bg-black/5"
      >
        Admin
      </button>
    </div>

    <p class="mt-6 text-center text-sm text-[var(--qb-muted)]">
      Don’t have an account?
      <a routerLink="/signup" class="font-semibold text-[var(--qb-primary)]">Create one</a>
    </p>
  </div>
</section>
