<section class="mx-auto flex min-h-[80vh] max-w-7xl items-center px-4 py-12 sm:px-6 lg:px-8">
  <div class="mx-auto w-full max-w-md rounded-3xl bg-white p-8 shadow-sm ring-1 ring-black/5">
    <div class="mb-8 text-center">
      <h1 class="text-3xl font-extrabold text-[var(--qb-text)]">Welcome Back</h1>
      <p class="mt-2 text-[var(--qb-muted)]">Login to continue to QuickBite</p>
    </div>

    <div class="mb-5 flex rounded-2xl bg-orange-50 p-1">
      <button
        type="button"
        (click)="setLoginType('EMAIL')"
        class="flex-1 rounded-2xl px-4 py-2 text-sm font-semibold"
        [class.bg-white]="form.loginType === 'EMAIL'"
        [class.text-[var(--qb-text)]]="form.loginType === 'EMAIL'"
        [class.text-[var(--qb-muted)]]="form.loginType !== 'EMAIL'"
      >
        Email
      </button>

      <button
        type="button"
        (click)="setLoginType('PHONE')"
        class="flex-1 rounded-2xl px-4 py-2 text-sm font-semibold"
        [class.bg-white]="form.loginType === 'PHONE'"
        [class.text-[var(--qb-text)]]="form.loginType === 'PHONE'"
        [class.text-[var(--qb-muted)]]="form.loginType !== 'PHONE'"
      >
        Phone
      </button>
    </div>

    <form class="space-y-5" (ngSubmit)="onLogin()">
      <div>
        <label class="mb-2 block text-sm font-semibold text-[var(--qb-text)]">
          {{ form.loginType === 'EMAIL' ? 'Email' : 'Phone Number' }}
        </label>
        <input
          [(ngModel)]="form.identifier"
          name="identifier"
          type="text"
          class="w-full rounded-2xl border border-black/10 px-4 py-3 outline-none focus:border-[var(--qb-primary)]"
          [placeholder]="form.loginType === 'EMAIL' ? 'Enter your email' : 'Enter your phone number'"
        />
      </div>

      <div>
        <label class="mb-2 block text-sm font-semibold text-[var(--qb-text)]">Password</label>
        <input
          [(ngModel)]="form.password"
          name="password"
          type="password"
          class="w-full rounded-2xl border border-black/10 px-4 py-3 outline-none focus:border-[var(--qb-primary)]"
          placeholder="Enter your password"
        />
      </div>

      @if (errorMessage) {
        <p class="rounded-2xl bg-red-50 px-4 py-3 text-sm font-medium text-red-600">
          {{ errorMessage }}
        </p>
      }

      <button
        type="submit"
        [disabled]="submitting"
        class="w-full rounded-2xl bg-[var(--qb-primary)] px-4 py-3 font-semibold text-white transition hover:opacity-90 disabled:opacity-50"
      >
        {{ submitting ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <div class="my-6 flex items-center gap-3">
      <div class="h-px flex-1 bg-black/10"></div>
      <span class="text-sm text-[var(--qb-muted)]">or</span>
      <div class="h-px flex-1 bg-black/10"></div>
    </div>

    <button
      type="button"
      (click)="loginWithGoogle()"
      class="flex w-full items-center justify-center gap-3 rounded-2xl border border-black/10 bg-white px-4 py-3 font-semibold text-[var(--qb-text)] shadow-sm transition hover:bg-gray-50"
    >
      <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="h-5 w-5" />
      Continue with Google
    </button>

    <p class="mt-6 text-center text-sm text-[var(--qb-muted)]">
      Don’t have an account?
      <a routerLink="/signup" class="font-semibold text-[var(--qb-primary)]">Sign Up</a>
    </p>
  </div>
</section>
