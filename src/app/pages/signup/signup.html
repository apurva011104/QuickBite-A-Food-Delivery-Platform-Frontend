<section class="mx-auto flex min-h-[80vh] max-w-7xl items-center px-4 py-12 sm:px-6 lg:px-8">
  <div class="mx-auto w-full max-w-lg rounded-3xl bg-white p-8 shadow-sm ring-1 ring-black/5">
    <div class="mb-8 text-center">
      <h1 class="text-3xl font-extrabold text-[var(--qb-text)]">Create Account</h1>
      <p class="mt-2 text-[var(--qb-muted)]">Join QuickBite today</p>
    </div>

    <form class="space-y-5" (ngSubmit)="onSignup()">
      <div>
        <label class="mb-2 block text-sm font-semibold text-[var(--qb-text)]">Full Name</label>
        <input
          [(ngModel)]="form.name"
          name="name"
          type="text"
          class="w-full rounded-2xl border border-black/10 px-4 py-3 outline-none focus:border-[var(--qb-primary)]"
          placeholder="Enter your full name"
        />
      </div>

      <div>
        <label class="mb-2 block text-sm font-semibold text-[var(--qb-text)]">Email</label>
        <input
          [(ngModel)]="form.email"
          name="email"
          type="email"
          class="w-full rounded-2xl border border-black/10 px-4 py-3 outline-none focus:border-[var(--qb-primary)]"
          placeholder="Enter your email"
        />
      </div>

      <div>
        <label class="mb-2 block text-sm font-semibold text-[var(--qb-text)]">Phone Number</label>
        <input
          [(ngModel)]="form.phoneNumber"
          name="phoneNumber"
          type="text"
          class="w-full rounded-2xl border border-black/10 px-4 py-3 outline-none focus:border-[var(--qb-primary)]"
          placeholder="Enter your phone number"
        />
      </div>

      <div>
        <label class="mb-2 block text-sm font-semibold text-[var(--qb-text)]">Password</label>
        <input
          [(ngModel)]="form.password"
          name="password"
          type="password"
          class="w-full rounded-2xl border border-black/10 px-4 py-3 outline-none focus:border-[var(--qb-primary)]"
          placeholder="Create a password"
        />
      </div>

      <div>
        <label class="mb-2 block text-sm font-semibold text-[var(--qb-text)]">Register as</label>
        <select
          [(ngModel)]="form.role"
          name="role"
          class="w-full rounded-2xl border border-black/10 bg-white px-4 py-3 outline-none focus:border-[var(--qb-primary)]"
        >
          <option value="CUSTOMER">Customer</option>
          <option value="OWNER">Restaurant Owner</option>
          <option value="AGENT">Delivery Agent</option>
        </select>
      </div>

      @if (errorMessage) {
        <p class="rounded-2xl bg-red-50 px-4 py-3 text-sm font-medium text-red-600">
          {{ errorMessage }}
        </p>
      }

      <button
        type="submit"
        [disabled]="submitting"
        class="w-full rounded-2xl bg-[var(--qb-primary)] px-4 py-3 font-semibold text-white transition hover:opacity-90 disabled:opacity-50"
      >
        {{ submitting ? 'Creating Account...' : 'Create Account' }}
      </button>
    </form>

    <div class="my-6 flex items-center gap-3">
      <div class="h-px flex-1 bg-black/10"></div>
      <span class="text-sm text-[var(--qb-muted)]">or</span>
      <div class="h-px flex-1 bg-black/10"></div>
    </div>

    <button
      type="button"
      (click)="loginWithGoogle()"
      class="flex w-full items-center justify-center gap-3 rounded-2xl border border-black/10 bg-white px-4 py-3 font-semibold text-[var(--qb-text)] shadow-sm transition hover:bg-gray-50"
    >
      <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="h-5 w-5" />
      Continue with Google
    </button>

    <p class="mt-6 text-center text-sm text-[var(--qb-muted)]">
      Already have an account?
      <a routerLink="/login" class="font-semibold text-[var(--qb-primary)]">Sign In</a>
    </p>
  </div>
</section>
